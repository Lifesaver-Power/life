<style>
:root { --bg: #edf3f1; --surface: #ffffff; --surface-2: #f4f8f7; --ink: #0f2420; --muted: #52645f; --line: #d2dfdb; --accent: #046351; --accent-soft: #dcf2eb; --logo: #046351; --mint: #05eccf; --red: #c23a31; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0a1714; --surface: #11221e; --surface-2: #162b26; --ink: #e3efec; --muted: #93aaa4; --line: #24403a; --accent: #3fe3c8; --accent-soft: #123832; --logo: #e3efec; --mint: #05eccf; --red: #ff7b70; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #0a1714; --surface: #11221e; --surface-2: #162b26; --ink: #e3efec; --muted: #93aaa4; --line: #24403a; --accent: #3fe3c8; --accent-soft: #123832; --logo: #e3efec; --mint: #05eccf; --red: #ff7b70; color-scheme: dark; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 "IBM Plex Sans", system-ui, sans-serif;
  display: grid; place-items: center; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px; box-sizing: border-box; }
.logo { width: 100%; height: auto; display: block; }
.tag { font: 700 9.5px "Montserrat", system-ui, sans-serif; letter-spacing: .22em; color: var(--logo); text-align: center; margin-top: -4px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.card { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 28px 24px; display: flex; flex-direction: column; gap: 14px; }
p { margin: 0; color: var(--muted); }
label { font-weight: 500; font-size: 13px; }
input[type=password] { width: 100%; box-sizing: border-box; font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 10px 12px; }
input[type=password]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.keep { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }
button { font: 600 14px "IBM Plex Sans", system-ui, sans-serif; background: var(--accent); color: var(--surface); border: 0; border-radius: 7px; padding: 10px; cursor: pointer; }
button:disabled { opacity: .6; cursor: wait; }
.err { color: var(--red); font-size: 13px; min-height: 1.5em; }
</style>

  const KEY = 'lifesaver-engine-key';
  const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const enc = u => btoa(String.fromCharCode.apply(null, new Uint8Array(u)));
  async function keyFromPassword(pw) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b(P.salt), iterations: P.it, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
  }
  async function open(key) {
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b(P.iv) }, key, b(P.ct));
    const html = new TextDecoder().decode(plain);
    document.open(); document.write(html); document.close();
  }
  // Remembered key from an earlier visit (tied to this build's salt)
  try {
    const saved = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (saved && saved.salt === P.salt) {
      crypto.subtle.importKey('raw', b(saved.k), 'AES-GCM', false, ['decrypt']).then(open).catch(() => localStorage.removeItem(KEY));
    }
  } catch (e) {}
  document.getElementById('gate').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('go'), err = document.getElementById('err');
    if (!window.crypto || !crypto.subtle) { err.textContent = 'This browser can’t open the model. Try a current Chrome, Safari or Edge.'; return; }
    btn.disabled = true; btn.textContent = 'Checking…'; err.textContent = '';
    try {
      const key = await keyFromPassword(document.getElementById('pw').value);
      if (document.getElementById('keep').checked) {
        try { localStorage.setItem(KEY, JSON.stringify({ salt: P.salt, k: enc(await crypto.subtle.exportKey('raw', key)) })); } catch (x) {}
      }
      await open(key);
    } catch (x) {
      btn.disabled = false; btn.textContent = 'Open';
      err.textContent = 'That password didn’t work. Check it and try again.';
      document.getElementById('pw').select();
    }
  });
})();
